<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- icons/square.svg, which is the export untouched, with the ground behind
       a media query. A vector favicon is the one icon here a browser
       re-renders rather than treating as a fixed picture, so it can follow the
       theme and not punch a white hole in a dark tab strip. The PNGs cannot do
       this and do not pretend to: iOS does not tint or darken a home screen
       icon without a native asset catalog, which a web app has no such thing
       as. Replaces the ring and dot, which was never this app's. -->
  <style>
    .ground { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) { .ground { fill: #141414; } }
  </style>
  <rect class="ground" width="1024" height="1024"/>
  <path id="card-1" fill="#E0070F" d="M144,256c0-48.60106,39.39894-88,88-88h560c48.60107,0,88,39.39894,88,88v212H144v-212Z"/>
  <path id="card-2" fill="#CAC307" d="M144,468c0-48.60104,39.39894-88,88-88h560c48.60107,0,88,39.39896,88,88v212H144v-212Z"/>
  <path id="card-3" fill="#E43E70" d="M144,680c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v212H144v-212Z"/>
  <path id="card-4" fill="#273287" d="M144,892c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v132H144v-132Z"/>
</svg>
