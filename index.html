<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Portrait, phone-first, no pinch zoom: this is a pass-the-phone game,
         and viewport-fit=cover lets the shell paint under the notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Ten pass-the-phone party games. No wifi, no accounts, no setup." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent lets the app's own background run to the top edge in both
         appearances, which the safe-area padding on .app__frame accounts for.
         The theme store rewrites theme-color on change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Call" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Last Call</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
