<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Portrait, phone-first, no pinch zoom: this is a pass-the-phone game,
         and viewport-fit=cover lets the shell paint under the notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The colour iOS paints behind the status bar in an installed app, and
         it OUTRANKS the translucent style below on iOS 16.4+. So it cannot be
         a constant: pinned to the shell it put a near-black band (or, in light
         appearance, a white one) above a screen flooded with a pack colour.
         lib/appBackground.ts rewrites it to whatever screen is open, and is
         the only thing that writes it. The value here is just the first paint,
         before React mounts — the shell, which is what Home is. -->
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Ten pass-the-phone party games. No wifi, no accounts, no setup." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent: iOS draws no chrome of its own behind the status bar, so
         the page's paint runs to the top edge and the icons stay light. Paired
         with the safe-area padding on .app__frame, which keeps the HEADER out
         from under those icons, and with --screen-h in tokens.css, which is
         sized for the taller web view this buys. Do not change one alone. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Call" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Last Call</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
