<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Android maskable variant: the same untouched paths, moved and
       scaled as one group so the drawing itself is never edited.

       Android guarantees only the centre circle of radius 40 percent. At 0.71,
       centred, every corner of the deck clears it: the square bottom corners
       land 401 of 410 and the rounded top corners 375 of 410.

       IT DOES NOT BLEED OFF THE BOTTOM, AND IT CANNOT. Sitting the deck low
       enough for the bottom card to leave the frame pushes the lowest shingle
       line out past the safe circle at every scale there is; the algebra has
       no solution, it is not a matter of picking a better number. Given the
       choice between the bottom card leaving the frame and the pink to navy
       line surviving a circular mask, the line wins, because it is one of the
       three that make this read as a deck at all. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g transform="translate(148.48,88.84) scale(0.71)">
  <path id="card-1" fill="#E0070F" d="M144,256c0-48.60106,39.39894-88,88-88h560c48.60107,0,88,39.39894,88,88v212H144v-212Z"/>
  <path id="card-2" fill="#CAC307" d="M144,468c0-48.60104,39.39894-88,88-88h560c48.60107,0,88,39.39896,88,88v212H144v-212Z"/>
  <path id="card-3" fill="#E43E70" d="M144,680c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v212H144v-212Z"/>
  <path id="card-4" fill="#273287" d="M144,892c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v132H144v-132Z"/>
  </g>
</svg>
