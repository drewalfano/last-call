<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Android maskable variant. A separate drawing, not a crop.

       Android guarantees only the centre circle of radius 40 percent, and
       masks the rest to whatever shape the launcher likes. So the deck is the
       same drawing at 0.78 scale, sat high enough that all eight rounded
       corners and all three shingle lines clear that circle with room to
       spare: the worst corner lands 385 out of 410, the lowest shingle line
       348 out of 410.

       The navy card still leaves the frame. Bleeding is the point of a
       maskable icon, not a mistake in one: a launcher that masks to a
       rounded square shows the deck running off the bottom exactly as the
       home screen icon does, and a launcher that masks to a circle cuts the
       navy where it is a solid block and the cut cannot be seen. Ending the
       card inside the circle instead would leave a small deck floating in a
       white field on every non circular launcher. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <path fill="#E0070F" d="M225,284a69,69 0 0 1 69,-69h436a69,69 0 0 1 69,69V380H225Z"/>
  <path fill="#CAC307" d="M225,449a69,69 0 0 1 69,-69h436a69,69 0 0 1 69,69V545H225Z"/>
  <path fill="#E43E70" d="M225,614a69,69 0 0 1 69,-69h436a69,69 0 0 1 69,69V710H225Z"/>
  <path fill="#273287" d="M225,779a69,69 0 0 1 69,-69h436a69,69 0 0 1 69,69V1024H225Z"/>
</svg>
