<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The app icon. These are the exported paths verbatim, in their own
       coordinates, with one rectangle added behind them.

       DO NOT REBUILD THE CARDS FROM THEIR VISIBLE BANDS. Each card is 300
       deep and the next one covers all but 212 of it, which is what fills the
       little notch at the shoulder of every card with the colour of the card
       above. Redrawing each card as just its visible 212 leaves those notches
       showing the ground instead, and at icon sizes four white nicks down each
       side stop reading as a deck and start reading as four separate stripes.
       That shipped once. The paths are the drawing; leave them alone.

       THE RECTANGLE IS THE ONLY ADDITION. The export is transparent and iOS
       composites transparency to black, so a ground gets painted whatever we
       do. White is the one the deck was drawn on and the only one the navy
       card has an edge against: #273287 on the app near black is 1.7:1.

       Colours are the pack palette, from the cat block in tokens.css. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <path id="card-1" fill="#E0070F" d="M144,256c0-48.60106,39.39894-88,88-88h560c48.60107,0,88,39.39894,88,88v212H144v-212Z"/>
  <path id="card-2" fill="#CAC307" d="M144,468c0-48.60104,39.39894-88,88-88h560c48.60107,0,88,39.39896,88,88v212H144v-212Z"/>
  <path id="card-3" fill="#E43E70" d="M144,680c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v212H144v-212Z"/>
  <path id="card-4" fill="#273287" d="M144,892c0-48.60107,39.39894-88,88-88h560c48.60107,0,88,39.39893,88,88v132H144v-132Z"/>
</svg>
